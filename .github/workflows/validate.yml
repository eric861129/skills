name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test read-only inventory
        run: >-
          python skills/consolidate-document-sprawl/scripts/inventory_documents.py
          . --format text
